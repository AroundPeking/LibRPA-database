name: Publish database
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Do not cancel an intermediate pending Publish: every accepted revision
  # must reach its own post-deployment live check.
  queue: max
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: 检查Pages配置（须先在Settings → Pages选择GitHub Actions）
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore the external byte cache
        uses: actions/cache@v4
        with:
          path: .external-cache
          key: external-cache-${{ hashFiles('database/data.json') }}
          restore-keys: external-cache-
      - name: 校验并公开全部缺证报告（网页发布不代表严格验收通过）
        run: python scripts/export_missing_evidence.py --check --report-output "${{ runner.temp }}/archive-completeness.json"
      - name: 保留全部记录的真实完整性报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-archive-completeness
          path: ${{ runner.temp }}/archive-completeness.json
          if-no-files-found: error
      - run: python scripts/library.py --check-catalog
      - run: python scripts/build_indexes.py --check
      - run: python scripts/public_scan.py .
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.mjs
      - run: python scripts/build_site.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Live verification includes every changed payload and may need mirror retries.
    timeout-minutes: 120
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # The live check covers every commit included in the accepted push.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed revision and changed payload paths
        # Keep this in the Publish workflow: its concurrency prevents a later
        # deployment from replacing this revision before the check finishes.
        env:
          PUBLISH_SHA: ${{ github.sha }}
          PUBLISH_BASE: ${{ github.event.before }}
        run: |
          args=(python scripts/verify_post_sync.py --skip-hash --skip-tree --live "https://aroundpeking.github.io/LibRPA-database" --live-commit "$PUBLISH_SHA")
          if [ -n "$PUBLISH_BASE" ] && [ "$PUBLISH_BASE" != "0000000000000000000000000000000000000000" ]; then
            args+=(--live-base "$PUBLISH_BASE")
          fi
          "${args[@]}"
