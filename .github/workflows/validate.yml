name: Validate database
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check database/app.js
      - run: node --test tests/*.mjs
      - name: 严格检查所有记录的完整上传证据（历史和诊断记录无豁免）
        run: python scripts/library.py --check-completeness --completeness-report "${{ runner.temp }}/archive-completeness.json"
      - name: 保留全部记录的完整性报告（失败仍阻断CI）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-archive-completeness
          path: ${{ runner.temp }}/archive-completeness.json
          if-no-files-found: error
      - run: python scripts/library.py --check-catalog
      - run: python scripts/build_indexes.py --check
      - run: python scripts/public_scan.py .
      - run: python -m unittest discover -s tests -v
