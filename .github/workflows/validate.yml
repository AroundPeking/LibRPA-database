name: Validate database
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/library.py --check-catalog
      - run: python scripts/build_indexes.py --check
      - run: python scripts/public_scan.py .
      - run: python -m unittest discover -s tests -v
