name: External archive sync

# After Validate and Publish accept a push to main, move any new large
# logs/results payloads to the Hugging Face dataset and commit the record
# rewrites, so merged data PRs reach the external archive automatically.
# Requires the HF_TOKEN repository secret (a write-scoped dataset token).

on:
  workflow_run:
    workflows: ["Publish database"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: external-archive-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !github.event.workflow_run || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The sync commits on top of main; give it the full history.
          fetch-depth: 0
      - name: Bind the accepted Publish revision
        id: accepted
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "Refusing stale sync: Publish accepted $EXPECTED_SHA, but main is $actual."
            echo "A newer Publish run must own the current main revision."
            exit 1
          fi
          echo "publish_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Hugging Face client
        run: pip install huggingface_hub
      - name: Restore the external byte cache
        uses: actions/cache@v4
        with:
          path: .external-cache
          key: external-cache-${{ hashFiles('database/data.json') }}
          restore-keys: external-cache-
      - name: Convert new large payloads to the referenced tier
        id: convert
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/sync_external_archive.py --paths-output converted-paths.txt
          if [ -s converted-paths.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Remove the converted local bytes and commit
        if: steps.convert.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git --literal-pathspecs rm --quiet --pathspec-from-file=converted-paths.txt
          git add -A data database archive-completeness.json
          git commit -m "Externalize new large payloads to the dataset archive" -m "Automated by the external-archive-sync workflow after validation."
      - name: Pre-push gate (HF bytes received, tree keeps no payload bytes)
        if: steps.convert.outputs.changed == 'true'
        run: python scripts/verify_post_sync.py --base "HEAD~1"
      - name: Push the verified externalization commit
        if: steps.convert.outputs.changed == 'true'
        run: git push
